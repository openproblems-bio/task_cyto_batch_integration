name: run_benchmark
namespace: workflows
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_unintegrated"
        __merge__: /src/api/file_unintegrated.yaml
        type: file
        direction: input
        required: true
      - name: "--input_censored_split1"
        __merge__: /src/api/file_censored_split1.yaml
        type: file
        direction: input
        required: true
      - name: "--input_censored_split2"
        __merge__: /src/api/file_censored_split2.yaml
        type: file
        direction: input
        required: true
  - name: Outputs
    arguments:
      - name: "--output_scores"
        type: file
        required: true
        direction: output
        description: A yaml file containing the scores of each of the methods
        default: score_uns.yaml
      - name: "--output_method_configs"
        type: file
        required: true
        direction: output
        default: method_configs.yaml
      - name: "--output_metric_configs"
        type: file
        required: true
        direction: output
        default: metric_configs.yaml
      - name: "--output_dataset_info"
        type: file
        required: true
        direction: output
        default: dataset_uns.yaml
      - name: "--output_task_info"
        type: file
        required: true
        direction: output
        default: task_info.yaml
  - name: Methods
    arguments:
      - name: "--paramsets"
        type: file
        direction: input
        required: false
        description: |
          A yaml file mapping method ids to named parameter sets, e.g.:

            cycombine:
              all_controls_to_goal:
                controls: all
                target: goal
            rpca:
              to_goal:
                target: goal

          Each listed method is run once per parameter set, with the given arguments
          and with `paramset_name`/`paramset` attached to its scores.
          If not provided, the parameter sets default to the `info.variants`
          defined in the method components' configs. A method without
          `info.variants` is run once with its default parameter set.
      - name: "--methods_include"
        type: string
        multiple: true
        description: |
          A list of method ids to include. If specified, only these methods will be run.
          For parameterised methods, a single paramset can be targeted as `<method_id>.<paramset_name>`, e.g. `cycombine.all_controls_to_goal`.
      - name: "--methods_exclude"
        type: string
        multiple: true
        description: |
          A list of method ids to exclude. If specified, all methods except the ones listed will be run.
          For parameterised methods, a single paramset can be excluded as `<method_id>.<paramset_name>`, e.g. `cycombine.all_controls_to_goal`.
  - name: Metrics
    arguments:
      - name: "--metrics_include"
        type: string
        multiple: true
        description: |
          A list of metric ids to include. If specified, only these metrics will be run.
      - name: "--metrics_exclude"
        type: string
        multiple: true
        description: |
          A list of metric ids to exclude. If specified, all metrics except the ones listed will be run.

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /_viash.yaml
  - path: /common/nextflow_helpers/helper.nf
  - path: paramset_helper.nf

dependencies:
  - name: utils/extract_uns_metadata
    repository: op
  - name: control_methods/shuffle_integration_globally
  - name: control_methods/no_integration
  - name: control_methods/perfect_integration
  - name: methods/harmonypy
  - name: methods/limma_remove_batch_effect
  - name: methods/combat
  - name: methods/cycombine
  - name: methods/gaussnorm
  - name: methods/cytonorm
  - name: methods/batchadjust
  - name: methods/rpca
  - name: metrics/emd
  - name: metrics/ratio_consistent_peaks
  - name: metrics/average_batch_r2
  - name: metrics/flowsom_mapping_similarity
  - name: metrics/lisi
  - name: metrics/functional_marker_preservation
  

runners:
  - type: nextflow
