name: precompute_metrics_info
namespace: data_processors
label: Precompute metrics information
summary: Precompute results on the unintegrated data that metrics reuse.
description: |
  Some metrics compare each integrated output against results computed on the
  unintegrated data. Those results don't depend on the method, so this component
  computes them once per dataset and the metrics read them back in.

  Currently precomputed:
  - functional_marker_preservation: biological groups, the (marker, cell_type)
    pairs significant in both batches, and the per-batch Wilcoxon and Cohen's d
    results on the unintegrated data.

arguments:
  - name: "--input_unintegrated"
    __merge__: /src/api/file_unintegrated.yaml
    direction: input
    required: true
  - name: "--output"
    __merge__: /src/api/file_precomputed_metric_info.yaml
    direction: output
    required: true
resources:
  - type: python_script
    path: script.py
  - path: /src/metrics/functional_marker_preservation/helper.py
  - path: /src/utils/helper_functions.py
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - path: /resources_test/task_cyto_batch_integration/mouse_spleen_flow_cytometry_subset
    dest: resources_test/task_cyto_batch_integration/mouse_spleen_flow_cytometry_subset
engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        packages:
          - scipy
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, midmem, lowcpu]
