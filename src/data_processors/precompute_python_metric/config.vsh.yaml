__merge__: ../../api/comp_precompute.yaml

name: precompute_python_metric
label: Precompute Python metric
summary: Precompute results on the unintegrated data that Python metrics reuse.
description: |
  Some metrics compare each integrated output against results computed on the
  unintegrated data. Those results don't depend on the method, so this component
  computes them once per dataset for the Python metrics, which read them back in.

  Currently precomputed:
  - functional_marker_preservation: biological groups, the (marker, cell_type)
    pairs significant in both batches, and the per-batch Wilcoxon and Cohen's d
    results on the unintegrated data.
  - ratio_consistent_peaks: the number of peaks of every marker per donor and
    cell type in split 1 and split 2 of the unintegrated data.

arguments:
  - name: "--output"
    __merge__: /src/api/file_precomputed_python_metric.yaml
    direction: output
    required: true
resources:
  - type: python_script
    path: script.py
  # one precompute module per metric
  - path: precompute_functional_marker_preservation.py
  - path: precompute_ratio_consistent_peaks.py
  # each metric's helper.py goes in a folder named after the metric, so the
  # modules can import it as <metric_name>.helper without the names clashing
  - path: /src/metrics/functional_marker_preservation/helper.py
    dest: functional_marker_preservation/helper.py
  - path: /src/metrics/ratio_consistent_peaks/helper.py
    dest: ratio_consistent_peaks/helper.py
  - path: /src/utils/helper_functions.py
engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        packages:
          - scipy
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, midmem, lowcpu]
