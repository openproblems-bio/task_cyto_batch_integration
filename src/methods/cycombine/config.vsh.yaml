# The API specifies which type of component this is.
# It contains specifications for:
#   - The input/output files
#   - Common parameters
#   - A unit test
__merge__: ../../api/comp_method.yaml

# A unique identifier for your component (required).
# Can contain only lowercase letters or underscores.
name: cycombine
# A relatively short label, used when rendering visualisations (required)
label: cyCombine
# A one sentence summary of how this method works (required). Used when
# rendering summary tables.
summary: "cyCombine batch integration using SOM clustering and ComBat, parameterised by control usage and correction target"
description: |
  cyCombine perform batch integration using self-organizing maps and ComBat.
  It first uses self-organizing maps (SOM) to group similar cells into clusters,
  then applies a ComBat-based method to correct batch effects within
  each cluster.
  The size of the SOM grid is varied linearly between value of 6-16, with default set to 8
  following the default value in create_som function in cyCombine.
  Rlen, which is the number of times data is presented to the SOM network and can impact
  clustering quality.
  It is varied linearly between value of 10-20 with default set to 10.

  This component is parameterised along two axes: `--controls` selects which control
  samples (replicates, in cyCombine terms) are used as anchors -- all control samples,
  none (controls are removed from the data), or the samples of a single control group --
  and `--target` selects whether batches are corrected towards batch 1 (`goal`) or
  towards a midpoint across batches (`mid`).
references:
  doi:
    - 10.1038/s41467-022-29383-5
links:
  documentation: https://biosurf.org/cyCombine.html
  repository: https://github.com/biosurf/cyCombine

info:
  variants:
    all_controls_to_goal:
      controls: all
      target: goal
    all_controls_to_mid:
      controls: all
      target: mid
    no_controls_to_goal:
      controls: none
      target: goal
    no_controls_to_mid:
      controls: none
      target: mid
    one_control_to_goal:
      controls: one
      target: goal
    one_control_to_mid:
      controls: one
      target: mid

argument_groups:
  - name: Parameter set
    arguments:
      - type: string
        name: --controls
        choices: [all, none, one]
        default: all
        description: Which control samples to use as anchors. `all` uses every control sample, `none` removes control samples and runs without anchors, `one` keeps only the first control group.
      - type: string
        name: --target
        choices: [goal, mid]
        default: mid
        description: Whether to correct batches towards reference batch 1 (`goal`) or towards a midpoint across batches (`mid`).
  - name: Parameters
    arguments:
      - type: integer
        name: --som_grid_size
        info:
          optimize:
            type: linear
            lower: 6
            upper: 16
        default: 8
        description: SOM grid size used by create_som
      - type: integer
        name: --rlen
        info:
          optimize:
            type: linear
            lower: 10
            upper: 20
        default: 10
        description: The number of time data is presented to SOM when clustering


resources:
  # The script of your component (required)
  - type: r_script
    path: script.R
  - type: r_script
    path: /src/utils/helper_functions.R

engines:
  - type: docker
    image: openproblems/base_r:1
    # Add custom dependencies here (optional). For more information, see
    # https://viash.io/reference/config/engines/docker/#setup .
    setup:
      - type: r
        bioc: [sva]
        packages: [pbmcapply]
        github: [biosurf/cyCombine]

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime,midmem,midcpu]
