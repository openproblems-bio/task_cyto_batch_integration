__merge__: ../../api/comp_metric.yaml

name: abundance_preservation

# Metadata for your component
info:
  metrics:
    # A unique identifier for your metric (required).
    # Can contain only lowercase letters or underscores.
    - name: abundance_preservation
      # A relatively short label, used when rendering visualisarions (required)
      label: Abundance Preservation
      # A one sentence summary of how this metric works (required). Used when
      # rendering summary tables.
      summary: "Assesses whether differences in cell abundance between groups are preserved after batch integration."
      # A multi-line description of how this component works (required). Used
      # when rendering reference documentation.
      description: |
        This metric checks whether differences in cell abundance between two
        groups (e.g. WT vs KO) survive batch integration. It never looks at the
        `cell_type` annotation: cell populations are defined by clustering, both
        before and after integration, so a method is judged on whether the
        abundance differences it preserves are still recoverable from the data
        alone. Control samples are excluded throughout.

        On the unintegrated data:
        1. Each batch is clustered separately with FlowSOM, using lineage markers
           only. Clustering per batch rather than across batches means the
           batch effect cannot merge or split populations.
        2. Every cluster is described by a MEM (Marker Enrichment Modeling) score
           vector (Diggins et al. 2017, Nature Methods;
           https://github.com/cytolab/cytoMEM), computed against all other cells
           in the same batch.
        3. Within each batch, the proportion of every sample's cells falling in
           each cluster is compared between the two groups with a Wilcoxon
           rank-sum test.
        4. Each batch 1 cluster is paired with the batch 2 cluster whose MEM
           vector is closest, measured by MEM RMSD similarity: the root-mean-square
           deviation between MEM vectors, rescaled to a percentage of the maximum
           possible RMSD (given MEM scores are bounded to [-10, 10]), where 100
           means identical MEM vectors and 0 means opposite extremes on every
           marker. The pairing is then checked in reverse - the batch 2 cluster
           must pick the same batch 1 cluster as its own closest match. Pairs that
           fail this check mean the two batches disagree about which cluster is
           which, so they are dropped.
        5. The clusters retained are the mutually matched pairs that are also
           differentially abundant in both batches. If none survive, the metric
           stops with an error rather than reporting a score: on a real dataset
           there should always be at least one reproducible difference to test.

        On each integrated split:
        6. All cells in the split are clustered with FlowSOM (lineage markers
           only) and each cluster gets a MEM score vector.
        7. Every cluster is matched to its closest cluster among the *full* batch 1
           clustering, and kept only if that match is one of the clusters retained
           in step 5. Matching against the full clustering rather than only the
           retained ones means a cluster with no good counterpart drops out instead
           of being forced onto a retained cluster. Its cells still count toward
           each sample's total, so proportions stay on the same scale as the
           unintegrated test. Batch 2 plays no part here: a batch 1 cluster and its
           batch 2 partner need not both be the nearest neighbour of the same
           integrated cluster, so requiring that would reject valid matches.
        8. Clusters that matched the same retained batch 1 cluster are pooled under
           it, and their combined per-sample proportions are tested between groups
           with the same Wilcoxon test.

        Each split scores the fraction of the step 5 clusters that are still
        differentially abundant in it, and the final score is the mean of the two
        splits' fractions.

        Because sample sizes per group/batch are small, the smallest achievable
        two-sided Wilcoxon p-value is around 0.1, so p <= 0.1 is used as the
        significance threshold (no multiple-testing correction is applied), the same
        convention used by the functional_marker_preservation metric.

        The metric assumes the dataset has exactly two batches: batch 1 supplies the
        reference clusters and batch 2 is used to confirm them.

        The MEM score and MEM RMSD are reimplemented directly in helper.R rather than
        depending on the cytoMEM package, because most cytoMEM functions are built for
        interactive, file-based analysis rather than being integrated into a pipeline
        as a headless component. The reimplementation is tested against cytoMEM's
        own MEM()/MEM_RMSD() on the benchmark's test data. See in tests/test_mem_against_reference.R.
        This test should be run periodically to ensure that the reimplementation remains consistent
        with cytoMEM's own implementation.

      references:
        doi:
          - 10.1038/nmeth.4149
      links:
        # URL to the documentation for this metric (required).
        documentation: https://github.com/cytolab/cytoMEM
        # URL to the code repository for this metric (required).
        repository: https://github.com/cytolab/MEM-examples
      # The minimum possible value for this metric (required)
      min: -0.0001
      # The maximum possible value for this metric (required)
      max: 1.0001
      # Whether a higher value represents a 'better' solution (required)
      maximize: true

# Resources required to run the component
resources:
  # The script of your component (required)
  - type: r_script
    path: script.R
  - path: helper.R
  - type: r_script
    path: /src/utils/helper_functions.R
engines:
  # Specifications for the Docker image for this component.
  - type: docker
    image: openproblems/base_r:1
    setup:
      - type: r
        bioc: [FlowSOM, flowCore]
        packages: [ dplyr, docstring, rlang, vctrs, lifecycle ]
runners:
  # This platform allows running the component natively
  - type: executable
  # Allows turning the component into a Nextflow module / pipeline.
  - type: nextflow
    directives:
      label: [midtime, midmem, midcpu]
