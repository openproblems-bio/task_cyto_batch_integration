type: file
example: "resources_test/task_cyto_batch_integration/mouse_spleen_flow_cytometry_subset/precomputed_python_metric.h5ad"
label: Precomputed Python metric
summary: Some precomputed results from unintegrated data that some Python metrics can reuse.
description: |
  An AnnData containing precomputed results from unintegrated data that
  are used by some Python metrics. They are stored in the `uns` slot:
    - functional_marker_preservation: biological groups, the (marker, cell_type)
      pairs significant in both batches, and the per-batch Wilcoxon and Cohen's d
      results on the unintegrated data.
    - ratio_consistent_peaks: `unintegrated_peaks`, the number of peaks of every
      marker per donor and cell type in split 1 and split 2 of the unintegrated
      data, plus the standard deviation of each split's expression.

info:
  format:
    type: h5ad
    uns:
      - type: object
        name: functional_marker_preservation
        description: "For computing the functional marker preservation metric."
        required: true
      - type: object
        name: ratio_consistent_peaks
        description: "For computing the ratio consistent peaks metric."
        required: true
