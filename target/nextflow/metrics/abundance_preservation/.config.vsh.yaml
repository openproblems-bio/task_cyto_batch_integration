info:
  metrics:
  - name: "abundance_preservation"
    label: "Abundance Preservation"
    summary: "Assesses whether differences in cell abundance between groups are preserved\
      \ after batch integration."
    description: "This metric checks whether differences in cell abundance between\
      \ two\ngroups (e.g. WT vs KO) survive batch integration. \n\nOn the unintegrated\
      \ data:\n1. Each batch is clustered separately with FlowSOM, using lineage markers\n\
      \   only. \n2. Compute MEM (Marker Enrichment Modeling) score\n   for each cluster\
      \ (Diggins et al. 2017, Nature Methods;\n   https://github.com/cytolab/cytoMEM).\n\
      3. Within each batch, find which clusters are differentially abundant\n   between\
      \ the two groups in the dataset using Wilcoxon\n   rank-sum test. Pvalue threshold\
      \ is set at <= 0.1. \n4. Using MEM RMSD similarity, for each batch 1 cluster\
      \ find its best match\n   in batch 2. MEM RMSD similarity is defined as the\
      \ root-mean-square\n   difference between two MEM vectors, rescaled to a percentage\
      \ of the maximum\n   possible RMSD (note, MEM scores are bounded to [-10, 10]),\
      \ where 100\n   means identical MEM vectors and 0 means opposite extremes on\
      \ every\n   marker. Repeat but reverse the pairing - for each cluster in batch\
      \ 2,\n   find the best matching cluster in batch 1.\n5. Retain clusters that\
      \ are mutually matched pairs and also\n   differentially abundant in both batches.\
      \ \n   If none survive, the metric stops with an error rather than reporting\n\
      \   a score.\n\nOn each integrated split:\n6. Cluster cells using FlowSOM (lineage\
      \ marker only) and compute\n   MEM score for each cluster.\n7. For each cluster,\
      \ find its closest cluster in *filtered* batch 1 clusters\n   calculated from\
      \ step 5 above.\n8. Run Wilcoxon rank-sum test to check whether those clusters\
      \ are still \n   differentially abundant between the two groups in the dataset.\
      \ \n9. Compute the proportion of clusters which remain differentially abundant\n\
      \   in the split.\n10. Repeat steps 6-9 for the second split.\n\nThe final metric\
      \ score is the mean of the two splits' proportions of clusters \nthat remain\
      \ differentially abundant.\n\nThe MEM score and MEM RMSD are reimplemented directly\
      \ in helper.R rather than\nusing the implementation provided by the cytoMEM\
      \ package, because the package\nis not modular enough. \nSee in tests/test_mem_against_reference.R\
      \ for unit tests which compare\nthe result of the reimplementation against cytoMEM's\n\
      own MEM()/MEM_RMSD() functions using the test data in the benchmark repo.\n\
      Note, this test should be run periodically to ensure that the reimplementation\
      \ remains consistent\nwith cytoMEM's own implementation.\n"
    references:
      doi:
      - "10.1038/nmeth.4149"
    links:
      documentation: "https://github.com/cytolab/cytoMEM"
      repository: "https://github.com/cytolab/MEM-examples"
    min: -0.0001
    max: 1.0001
    maximize: true
  type: "metric"
  type_info:
    label: "Metric"
    summary: "A task template metric."
    description: "A metric for evaluating method predictions.\n"
